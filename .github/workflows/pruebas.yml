name: Pruebas

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ./gradlew check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CHROME_OPTIONS: --headless

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Fijar la versión de la API de Docker
        run: echo 'api.version=1.44' > ~/.docker-java.properties

      - name: Ejecutar todas las pruebas
        run: ./gradlew check --continue

      - name: Publicar los reportes de las pruebas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reportes-de-pruebas
          path: |
            build/reports/
            build/test-results/
          if-no-files-found: ignore
